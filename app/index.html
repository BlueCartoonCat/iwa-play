<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="IWA Play iOS &amp; MacOS screen and media receiver."
    />
    <link rel="manifest" href="/.well-known/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="stylesheet" href="/app.css" />
    <title>IWA Play</title>
  </head>
  <body>
    <main class="tv-shell">
      <button
        id="settingsButton"
        class="gear-button"
        type="button"
        aria-label="Settings and logs"
        title="Settings and logs"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05-2.8 2.8-.06-.05a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21h-3.96v-.08a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.87.34l-.06.05-2.8-2.8.05-.06A1.7 1.7 0 0 0 4.67 15a1.7 1.7 0 0 0-1.56-1.04H3v-3.96h.11A1.7 1.7 0 0 0 4.67 9a1.7 1.7 0 0 0-.34-1.87l-.05-.06 2.8-2.8.06.05A1.7 1.7 0 0 0 9 4.67a1.7 1.7 0 0 0 1.04-1.56V3h3.96v.11A1.7 1.7 0 0 0 15 4.67a1.7 1.7 0 0 0 1.87-.34l.06-.05 2.8 2.8-.05.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.49 1.04H21v3.96h-.11A1.7 1.7 0 0 0 19.4 15Z"
          />
        </svg>
      </button>
      <section class="receiver-screen" aria-label="Receiver status">
        <img id="airplayPhoto" class="media-frame" alt="AirPlay photo" hidden />
        <video
          id="airplayVideo"
          class="media-frame"
          autoplay
          playsinline
          hidden
        ></video>
        <canvas
          id="mirrorCanvas"
          class="media-frame"
          hidden
          aria-label="AirPlay H.264 mirror video"
        ></canvas>
        <div class="airplay-mark" aria-hidden="true">
          <svg viewBox="0 0 124 124" fill="none" role="presentation">
            <rect
              x="14"
              y="12"
              width="96"
              height="68"
              rx="7"
              stroke="currentColor"
              stroke-width="5"
            />
            <path d="M62 31 34 69h56L62 31Z" fill="currentColor" />
            <path
              d="M44 101h36"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <p class="sr-only" id="stateLabel" role="status" aria-live="polite">
          Starting IWA Play
        </p>
        <span id="stateDot" class="sr-only" aria-hidden="true"></span>
        <p class="sr-only" id="helperText"></p>
      </section>
    </main>

    <div class="overlay" id="setupOverlay" aria-hidden="false">
      <form class="setup-card" id="setupForm" novalidate>
        <header class="modal-header">
          <h2 id="modalTitle">Settings</h2>
          <button
            id="closeSettings"
            class="modal-close"
            type="button"
            aria-label="Close settings"
          >
            ×
          </button>
        </header>
        <nav class="modal-tabs" aria-label="Settings sections">
          <button
            id="settingsTab"
            class="modal-tab selected"
            type="button"
            aria-selected="true"
          >
            Settings
          </button>
          <button
            id="logsTab"
            class="modal-tab"
            type="button"
            aria-selected="false"
          >
            Logs
          </button>
        </nav>
        <section id="settingsPanel">
          <label for="lanIp">IPv4 addresses</label>
          <input
            id="lanIp"
            name="ip"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            spellcheck="false"
            placeholder="192.168.1.42, 10.0.0.4"
          />
          <label for="deviceName">Receiver name</label>
          <input
            id="deviceName"
            name="name"
            type="text"
            maxlength="46"
            value="IWA Play"
            spellcheck="false"
            required
          />
          <label for="resolutionPreset">Resolution</label>
          <select id="resolutionPreset" name="resolution">
            <option value="854x480">480p</option>
            <option value="1280x720">720p</option>
            <option value="1920x1080" selected>1080p</option>
            <option value="2560x1440">1440p</option>
            <option value="3840x2160">4K</option>
            <option value="custom">Custom</option>
          </select>
          <div id="customResolution" class="custom-resolution" hidden>
            <label for="resolutionWidth">Width</label>
            <input
              id="resolutionWidth"
              type="number"
              min="320"
              max="4096"
              step="1"
              value="1920"
            />
            <label for="resolutionHeight">Height</label>
            <input
              id="resolutionHeight"
              type="number"
              min="240"
              max="2160"
              step="1"
              value="1080"
            />
          </div>
          <p id="setupError" class="error-message" role="alert" hidden></p>
          <div class="settings-actions">
            <button id="connectButton" class="connect-button" type="submit">
              Apply
            </button>
            <a
              class="github-link"
              href="https://github.com/BlueCartoonCat/iwa-play"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="View IWA Play on GitHub (opens in a new window)"
              title="View on GitHub"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .297a12 12 0 0 0-3.79 23.387c.6.111.82-.26.82-.577v-2.234c-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.084 1.84 1.237 1.84 1.237 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.304-5.467-1.333-5.467-5.931 0-1.31.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.323 3.301 1.23a11.5 11.5 0 0 1 6.006 0c2.291-1.553 3.297-1.23 3.297-1.23.654 1.652.243 2.873.12 3.176.77.84 1.235 1.91 1.235 3.22 0 4.61-2.807 5.625-5.48 5.922.43.372.823 1.102.823 2.222v3.294c0 .32.216.694.825.576A12.002 12.002 0 0 0 12 .297Z"/>
              </svg>
            </a>
          </div>
        </section>
        <section
          id="logsPanel"
          class="modal-logs"
          hidden
          aria-label="AirPlay logs"
        >
          <div
            class="logs-stream"
            id="logOutput"
            role="log"
            aria-live="off"
          ></div>
        </section>
      </form>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
